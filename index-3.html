var filter='all',cur=[],res={};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(s){return String(s).toLowerCase().replace(/[.\s]+/g,' ').trim()}
function byN(n){for(var i=0;i<ALL.length;i++)if(ALL[i].n==n)return ALL[i];return null}
function correctText(q){
  if(q.type==='mcq'||q.type==='multi')return q.c.slice().sort(function(a,b){return a-b}).map(function(i){return L[i]+') '+q.opts[i]}).join('  +  ');
  if(q.type==='fill')return q.ans.join(' / ');
  return q.ans;
}
function render(){
  var h='',last='';
  cur.forEach(function(q){
    if(q.sec!==last){last=q.sec;h+='<div class="sec">'+esc(SECS[q.sec].title)+'</div>';}
    h+='<div class="card" id="c'+q.n+'"><div class="qh"><span class="qn">'+q.num+'</span><span class="tag">'+SECS[q.sec].tag+'</span></div>';
    h+='<div class="qt">'+esc(q.q)+'</div>';
    if(q.type==='prob'&&q.fig.length)h+='<div class="fig">'+q.fig.map(function(k){return im(k)}).join('')+'</div>';
    if(q.type==='mcq'||q.type==='multi'){
      if(q.type==='multi')h+='<div class="hint">اختر الإجابتين الصحيحتين (الفراغين) ثم اضغط «تأكيد الإجابة»</div>';
      h+='<div class="opts">'+q.opts.map(function(o,i){return '<button type="button" class="opt" data-act="opt" data-n="'+q.n+'" data-i="'+i+'"><b>'+L[i]+'</b><span>'+esc(o)+'</span></button>'}).join('')+'</div>';
      if(q.type==='multi')h+='<div class="btns"><button type="button" class="btn" data-act="confirm" data-n="'+q.n+'">تأكيد الإجابة ✔</button></div>';
    }else if(q.type==='fill'){
      h+=q.ans.map(function(a,i){return '<input class="inp" type="text" autocomplete="off" placeholder="'+(q.ans.length>1?'الإجابة '+(i+1):'اكتب إجابتك هنا')+'">'}).join('');
      h+='<div class="btns"><button type="button" class="btn" data-act="check" data-n="'+q.n+'">تحقق ✔</button><button type="button" class="btn gh" data-act="giveup" data-n="'+q.n+'">اعرض الإجابة 👁</button></div>';
    }else{
      h+='<input class="inp" type="text" autocomplete="off" placeholder="اكتب إجابتك هنا (اختياري)">';
      h+='<div class="btns"><button type="button" class="btn" data-act="show" data-n="'+q.n+'">اعرض الحل 👁</button></div>';
      h+='<div class="solbox" id="sol'+q.n+'"><div class="ans">Ans = '+esc(q.ans)+'</div>'+q.sol+'</div>';
      h+='<div class="grade" id="gr'+q.n+'"><div style="font-size:13px;margin-bottom:6px">قارن إجابتك بالحل وقيّم نفسك:</div><div class="btns"><button type="button" class="btn g" data-act="grade" data-v="1" data-n="'+q.n+'">✅ إجابتي صح</button><button type="button" class="btn r" data-act="grade" data-v="0" data-n="'+q.n+'">❌ إجابتي غلط</button></div></div>';
    }
    h+='<div class="fb" id="fb'+q.n+'"></div></div>';
  });
  $('cards').innerHTML=h;
}
function updateBar(){
  var total=cur.length,done=0,c=0;
  for(var k in res){done++;if(res[k])c++;}
  $('sNum').textContent=done+'/'+total;
  $('sC').textContent='✅ '+c;$('sW').textContent='❌ '+(done-c);
  $('sP').textContent='📊 '+(done?Math.round(c/done*100):0)+'%';
  $('sFill').style.width=(total?done/total*100:0)+'%';
  $('submitBtn').disabled=done<total;
}
function finish(q,ok){
  res[q.n]=ok;
  $('c'+q.n).className='card '+(ok?'ok':'no');
  var fb=$('fb'+q.n);fb.className='fb '+(ok?'ok':'no');fb.style.display='block';
  fb.innerHTML=(ok?'✅ إجابة صحيحة! ':'❌ الإجابة الصحيحة: <b dir="ltr">'+esc(correctText(q))+'</b><br>')+esc(q.exp)+(q.note?'<div class="note">'+esc(q.note)+'</div>':'');
  updateBar();
}
function lockOpts(q,picked){
  var bs=$('c'+q.n).querySelectorAll('.opt');
  for(var j=0;j<bs.length;j++){
    var i=+bs[j].getAttribute('data-i');
    bs[j].classList.remove('sel');
    if(q.c.indexOf(i)>-1)bs[j].classList.add('right');else if(picked.indexOf(i)>-1)bs[j].classList.add('bad');
    bs[j].disabled=true;
  }
}
function onClick(e){
  var b=e.target;
  while(b&&b!==document&&!(b.getAttribute&&b.getAttribute('data-act')))b=b.parentNode;
  if(!b||b===document)return;
  var q=byN(b.getAttribute('data-n'));
  if(!q||res[q.n]!==undefined)return;
  var act=b.getAttribute('data-act'),card=$('c'+q.n),i,inputs;
  if(act==='opt'){
    i=+b.getAttribute('data-i');
    if(q.type==='mcq'){lockOpts(q,[i]);finish(q,q.c.indexOf(i)>-1);}
    else b.classList.toggle('sel');
  }else if(act==='confirm'){
    var picked=[],sel=card.querySelectorAll('.opt.sel');
    for(i=0;i<sel.length;i++)picked.push(+sel[i].getAttribute('data-i'));
    if(!picked.length)return;
    var ok=picked.length===q.c.length&&q.c.every(function(x){return picked.indexOf(x)>-1});
    lockOpts(q,picked);b.disabled=true;finish(q,ok);
  }else if(act==='check'||act==='giveup'){
    inputs=card.querySelectorAll('.inp');
    var all=true,empty=true;
    for(i=0;i<inputs.length;i++){
      var good=norm(inputs[i].value)===norm(q.ans[i]);
      if(!good)all=false;if(inputs[i].value.trim())empty=false;
    }
    if(act==='check'&&empty)return;
    for(i=0;i<inputs.length;i++){inputs[i].className='inp '+(norm(inputs[i].value)===norm(q.ans[i])?'ok':'no');inputs[i].disabled=true;}
    var bt=card.querySelectorAll('.btns .btn');for(i=0;i<bt.length;i++)bt[i].disabled=true;
    finish(q,act==='check'&&all);
  }else if(act==='show'){
    $('sol'+q.n).style.display='block';$('gr'+q.n).style.display='block';b.disabled=true;
  }else if(act==='grade'){
    var inp=card.querySelector('.inp');if(inp)inp.disabled=true;
    $('gr'+q.n).style.display='none';finish(q,b.getAttribute('data-v')==='1');
  }
}
function start(scroll){
  cur=ALL.filter(function(q){return filter==='all'||q.sec===filter});
  res={};
  $('qCount').textContent=cur.length;
  $('result').style.display='none';
  render();updateBar();
  if(scroll)window.scrollTo(0,0);
}
function showResults(){
  var total=cur.length,c=cur.filter(function(q){return res[q.n]}).length,p=total?Math.round(c/total*100):0;
  $('rScore').textContent=c;$('rTotal').textContent=total;$('rC').textContent=c;$('rW').textContent=total-c;$('rP').textContent=p+'%';
  $('rMsg').textContent=p>=90?'ممتاز! مستواك رائع 🌟':p>=75?'جيد جداً، كمّل كده 👏':p>=50?'مستوى كويس، راجع الأخطاء وهتتحسن 💪':'محتاج مراجعة أكتر، ذاكر وجرّب تاني 📚';
  var wr=cur.filter(function(q){return !res[q.n]}),h='';
  if(wr.length){h='<h3>📝 مراجعة الأسئلة الغلط ('+wr.length+')</h3>';wr.forEach(function(q){h+='<div class="ri"><div class="q">'+SECS[q.sec].tag+' — Q'+q.num+': '+esc(q.q)+'</div><div>✅ <b dir="ltr">'+esc(correctText(q))+'</b></div><div>'+esc(q.exp)+'</div>'+(q.note?'<div class="note">'+esc(q.note)+'</div>':'')+'</div>';});}
  else h='<h3>🎯 كل إجاباتك صح!</h3>';
  $('rev').innerHTML=h;$('result').style.display='block';
  $('result').scrollIntoView();
}
function init(){
  var fb=document.querySelectorAll('.fbtn');
  for(var i=0;i<fb.length;i++)fb[i].addEventListener('click',function(){
    for(var j=0;j<fb.length;j++)fb[j].classList.remove('active');
    this.classList.add('active');filter=this.getAttribute('data-cat');start(false);
  });
  document.addEventListener('click',onClick);
  $('submitBtn').addEventListener('click',showResults);
  $('againBtn').addEventListener('click',function(){start(true)});
  $('topBtn').addEventListener('click',function(){window.scrollTo(0,0)});
  start(false);
}
init();
</script>
</body>
</html>
